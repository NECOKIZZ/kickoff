<script>
(function(){

const ID = "04-fulltime";
const D = 7;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(44);
const R = (a,b)=>a+(b-a)*rng();
const $ = (s)=>document.querySelector('#root[data-composition-id="'+ID+'"] '+s) || document.querySelector(s);
const $$ = (s)=>Array.from(document.querySelectorAll(s));
const tl = gsap.timeline({ paused: true });
// film grain: jump the noise plate every 80ms (seeded, seek-safe)
(function(){const g=$(".f04-grain");for(let t=0;t<D;t+=0.08){tl.set(g,{x:Math.round(R(-280,280)),y:Math.round(R(-280,280))},t);}})();
// drifting particles
function particles(container, n, opts){
  opts = opts || {};
  const host = $(container);
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "f04-dot";
    const s = R(1.2, opts.big||3.6);
    d.style.width = s+"px"; d.style.height = s+"px";
    d.style.left = R(0,1920)+"px"; d.style.top = R(0,1080)+"px";
    const c = rng()<0.55 ? "#7B62F6" : (rng()<0.5 ? "#00C805" : "#ffffff");
    d.style.background = c; d.style.boxShadow = "0 0 "+(s*4)+"px "+c;
    host.appendChild(d);
    const a = R(0.25,0.9);
    tl.fromTo(d,{opacity:0,y:0,x:0},{opacity:a,duration:R(0.4,1.2),ease:"sine.out"},R(0,0.8));
    tl.to(d,{y:-R(opts.rise||40,(opts.rise||40)*3),x:R(-30,30),duration:D,ease:"none"},0);
  }
}


particles("#f04-particles", 60, {rise:40});
// FT slam + shockwave + camera shake
tl.fromTo("#f04-board",{scale:1.8,opacity:0},{scale:1,opacity:1,duration:.35,ease:"expo.in"},0.05);
tl.fromTo("#f04-flash",{opacity:0},{opacity:.7,duration:.05},0.4); tl.to("#f04-flash",{opacity:0,duration:.6},0.45);
tl.fromTo("#f04-shock",{scale:0,opacity:1},{scale:22,opacity:0,duration:1.1,ease:"power2.out"},0.4);
[[14,-8],[-12,10],[9,6],[-6,-5],[3,3],[0,0]].forEach((p,i)=>tl.to("#f04-shake",{x:p[0],y:p[1],duration:.05},0.4+i*.05));
tl.fromTo("#f04-shake",{scale:1},{scale:1.04,duration:6.4,ease:"sine.inOut"},0.6);
// the pool comes alive
tl.fromTo("#f04-orb",{scale:0},{scale:1,duration:.7,ease:"back.out(1.8)"},0.9);
tl.fromTo("#f04-ring",{scale:0,rotation:0},{scale:1,rotation:40,duration:1,ease:"expo.out"},1.0);
tl.to("#f04-ring",{rotation:160,duration:5,ease:"none"},2.0);
tl.to("#f04-orb",{scale:1.08,duration:.6,ease:"sine.inOut",repeat:7,yoyo:true},1.6);
tl.fromTo("#f04-ol",{opacity:0},{opacity:1,duration:.5},1.3);
$$(".f04-chip").forEach((c,i)=>tl.fromTo(c,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.45,ease:"back.out(2)"},1.0+i*.07));
// beams stream to the close picks ("the nearer you land…")
$$(".f04-beam").forEach((b,i)=>tl.fromTo(b,{strokeDashoffset:1},{strokeDashoffset:0,duration:.6,ease:"power2.out"},1.7+i*.12));
$$(".f04-flow").forEach((f,i)=>{tl.set(f,{opacity:.9},2.2); tl.fromTo(f,{strokeDashoffset:0},{strokeDashoffset:-540,duration:4.8,ease:"none"},2.2);});
$$(".f04-chip").forEach((c,i)=>{
  const d=+c.dataset.d, share={0:1,1:.62,2:.28}[d];
  if(share) tl.fromTo("#f04-m"+i,{scaleX:0},{scaleX:share,duration:1.3,ease:"power2.out"},2.1+d*.25);
  else tl.to(c,{opacity:.28,filter:"saturate(0) blur(1px)",duration:.6},2.2);
});
// on-screen proof line
$$("#f04-head span").forEach((s,i)=>tl.fromTo(s,{opacity:0,y:30,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.55,ease:"expo.out"},3.9+i*.45));

window.__timelines["04-fulltime"] = tl;
})();
</script>
