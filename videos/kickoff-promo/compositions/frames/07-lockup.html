(function(){const g=$(".f07-grain");for(let t=0;t<D;t+=0.08){tl.set(g,{x:Math.round(R(-280,280)),y:Math.round(R(-280,280))},t);}})();

function particles(container, n, opts){
  opts = opts || {};

  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "f07-dot";
    const s = R(1.2, opts.big||3.6);
    d.style.width = s+"px"; d.style.height = s+"px";

  }
}
